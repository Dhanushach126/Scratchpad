<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA9D6" />
      <stop offset="100%" stop-color="#D4A1FF" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161618" />
      <stop offset="100%" stop-color="#0E0E10" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background tile with subtle border -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Glowing Emblem -->
  <rect x="96" y="96" width="320" height="320" rx="72" fill="url(#grad)" filter="url(#glow)" />
  <rect x="96" y="96" width="320" height="320" rx="72" fill="url(#grad)" />

  <!-- Center Monogram "S" -->
  <text x="50%" y="54%" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="210" font-weight="900" fill="#111111" text-anchor="middle" dominant-baseline="central">S</text>
</svg>

