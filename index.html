<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Scratchpad — A secure multi-user workspace for sharing notes, code snippets, checklists, and files with granular permissions." />
    <meta name="theme-color" content="#09090b" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- Content Security Policy to restrict malicious scripts. Allows unsafe-inline for current inline styles/scripts, but limits domains -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://ofvjesvasdoenhjnrhky.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://ofvjesvasdoenhjnrhky.supabase.co wss://ofvjesvasdoenhjnrhky.supabase.co; img-src 'self' data: https:;" />
    <title>Scratchpad — Executive Workspace</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Styles -->
    <link rel="stylesheet" href="/styles/index.css" />
    <link rel="stylesheet" href="/styles/components.css" />
    <link rel="stylesheet" href="/styles/auth.css" />
    <link rel="stylesheet" href="/styles/editor.css" />

    <!-- Prism.js for code highlighting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" />
</head>
<body>
    <div id="app">
        <!-- ============================================================ -->
        <!-- AUTH VIEW -->
        <!-- ============================================================ -->
        <div id="auth-view">
            <div class="auth-card">
                <div class="auth-logo">
                    <div class="auth-logo-badge">S</div>
                    <h1>Scratchpad</h1>
                    <p>Executive Workspace & Knowledge Hub</p>
                </div>

                <div id="auth-error" class="auth-error"></div>

                <!-- Login Form -->
                <form id="login-form" class="auth-form">
                    <div class="input-group">
                        <label class="input-label" for="login-email">Email Address</label>
                        <input type="email" id="login-email" class="input-field" placeholder="name@company.com" required autocomplete="email" />
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="login-password">Password</label>
                        <input type="password" id="login-password" class="input-field" placeholder="••••••••" required autocomplete="current-password" minlength="6" />
                    </div>
                    <button type="submit" id="login-submit" class="auth-submit">Sign In</button>
                    <p class="auth-toggle">Don't have an account? <a id="show-register">Create workspace account</a></p>
                </form>

                <!-- Register Form -->
                <form id="register-form" class="auth-form hidden">
                    <div class="input-group">
                        <label class="input-label" for="register-username">Username</label>
                        <input type="text" id="register-username" class="input-field" placeholder="username" required autocomplete="username" minlength="3" maxlength="30" pattern="[a-zA-Z0-9_]+" title="Letters, numbers, and underscores only" />
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="register-email">Email Address</label>
                        <input type="email" id="register-email" class="input-field" placeholder="name@company.com" required autocomplete="email" />
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="register-password">Password</label>
                        <input type="password" id="register-password" class="input-field" placeholder="Min. 6 characters" required autocomplete="new-password" minlength="6" />
                    </div>
                    <button type="submit" id="register-submit" class="auth-submit">Create Account</button>
                    <p class="auth-toggle">Already have an account? <a id="show-login">Sign in</a></p>
                </form>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- WORKSPACE VIEW -->
        <!-- ============================================================ -->
        <div id="workspace-view">
            <!-- Sidebar Overlay (mobile) -->
            <div class="sidebar-overlay" id="sidebar-overlay"></div>

            <!-- Sidebar -->
            <aside id="sidebar">
                <div class="sidebar-header">
                    <div class="sidebar-brand">
                        <div class="sidebar-brand-title">
                            <div class="sidebar-brand-logo"><span>S</span></div>
                            <h2>Scratchpad</h2>
                        </div>
                    </div>

                    <div class="sidebar-search">
                        <span class="search-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        </span>
                        <input type="text" id="search-input" placeholder="Search pads…" autocomplete="off" />
                        <kbd>⌘K</kbd>
                    </div>

                    <div class="sidebar-actions">
                        <div class="dropdown" id="new-pad-dropdown" style="width:100%;">
                            <button class="btn btn-primary" id="new-pad-btn" style="width:100%;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                                Create New Pad
                            </button>
                            <div class="dropdown-menu" id="new-pad-menu">
                                <button class="dropdown-item" data-type="note">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>
                                    Note Document
                                </button>
                                <button class="dropdown-item" data-type="code">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                                    Code Snippet
                                </button>
                                <button class="dropdown-item" data-type="checklist">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                                    Task Checklist
                                </button>
                                <button class="dropdown-item" data-type="file">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                                    File Collection
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="sidebar-section-header">Workspace Pads</div>

                <div class="sidebar-list" id="pad-list">
                    <!-- Pad items rendered by JS -->
                </div>

                <div class="sidebar-footer">
                    <div class="sidebar-user">
                        <div class="avatar" id="user-avatar"></div>
                        <div class="sidebar-user-info">
                            <div class="sidebar-username" id="user-display-name"></div>
                            <div class="sidebar-role" id="user-role"></div>
                        </div>
                    </div>
                    <div class="sidebar-footer-actions">
                        <button class="btn-icon" id="admin-panel-btn" data-tooltip="Admin Controls" style="display:none;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                        <button class="btn-icon" id="theme-toggle-btn" data-tooltip="Toggle Theme">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="theme-icon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                        </button>
                        <button class="btn-icon" id="logout-btn" data-tooltip="Sign Out">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                        </button>
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <main id="main-content">
                <div id="content-header" class="hidden">
                    <button class="btn-icon" id="mobile-menu-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
                    </button>
                    
                    <div class="header-title-container">
                        <span class="save-status-dot" id="header-save-dot" title="All changes saved"></span>
                        <input type="text" id="pad-title-input" placeholder="Untitled document" />
                    </div>

                    <div class="header-actions">
                        <div class="tag-editor" id="tag-editor"></div>
                        <label class="switch" id="sensitive-toggle" data-tooltip="Mark as Sensitive">
                            <input type="checkbox" id="sensitive-checkbox" />
                            <span class="switch-slider"></span>
                        </label>
                        <span id="sensitive-label" style="font-size: var(--font-size-xs); color: var(--color-amber); display: none;">🔒</span>
                        <button class="btn btn-ghost btn-sm" id="share-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg>
                            Share
                        </button>
                        <button class="btn btn-danger btn-sm" id="delete-pad-btn" title="Delete Pad">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                        </button>
                    </div>
                </div>

                <div id="content-body">
                    <!-- Empty State -->
                    <div id="empty-state">
                        <div class="empty-icon-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/></svg>
                        </div>
                        <h2>No pad selected</h2>
                        <p>Select a document from the sidebar or press <kbd>⌘N</kbd> to create a new pad.</p>
                    </div>

                    <!-- Editor Container (rendered by JS) -->
                    <div id="editor-root" class="hidden"></div>

                    <!-- Admin Panel -->
                    <div id="admin-panel-root" class="hidden"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- MODALS -->
    <!-- ============================================================ -->

    <!-- Permissions Modal -->
    <div class="modal-overlay" id="permissions-modal">
        <div class="modal">
            <div class="modal-header">
                <h3>Share & Permissions</h3>
                <button class="btn-icon" id="permissions-modal-close">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="perm-grant-form">
                    <input type="text" id="perm-username-input" class="input-field" placeholder="Enter email address or username…" autocomplete="off" />
                    <select id="perm-level-select" class="select-field">
                        <option value="view">Viewer</option>
                        <option value="edit">Editor</option>
                    </select>
                    <button class="btn btn-primary" id="perm-grant-btn">Grant</button>
                </div>
                <div style="display:flex; align-items:center; gap:6px; font-size:12px; color:var(--color-text-secondary); margin-bottom:16px;">
                    <input type="checkbox" id="perm-notify-email" checked style="cursor:pointer;" />
                    <label for="perm-notify-email" style="cursor:pointer;">Send Gmail message with access link</label>
                </div>
                <div id="perm-user-list">
                    <!-- Permission rows rendered by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js" defer></script>

    <!-- App Entry -->
    <script type="module" src="/js/app.js"></script>
</body>
</html>
